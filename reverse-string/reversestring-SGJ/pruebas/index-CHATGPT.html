<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse String</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f8ff;
      }

      .container {
        text-align: center;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        text-align: center;
      }

      button {
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
        margin: 5px;
      }

      button:hover {
        background-color: #45a049;
      }

      .result {
        margin-top: 15px;
        font-size: 18px;
        color: #333;
      }

      .error {
        color: red;
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        input[type="text"],
        button {
          font-size: 14px;
        }

        .result {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Invertir Cadena de Texto y Copiar</h1>
      <input type="text" id="textInput" placeholder="Escribe algo..." />
      <button id="invertButton">Invertir</button>
      <button id="copyButton">Copiar</button>
      <div class="error" id="error"></div>
      <div class="result" id="result"></div>
    </div>
    <script src="script-CHATGPT.js"></script>
  </body>
</html>
